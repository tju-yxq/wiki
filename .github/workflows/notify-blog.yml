name: Notify tju-yxq/blog to sync

on:
  push:
    branches: [main]
    paths:
      - 'docs/notes/**'
      - 'docs/public/**'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger blog sync via repository_dispatch
        if: ${{ secrets.BLOG_SYNC_TOKEN != '' }}
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.BLOG_SYNC_TOKEN }}" \
            https://api.github.com/repos/tju-yxq/blog/dispatches \
            -d '{"event_type":"wiki-updated"}'
